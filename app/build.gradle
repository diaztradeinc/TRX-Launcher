plugins { id 'com.android.application' }

android {
    namespace 'com.mdiaz.trxlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mdiaz.trxlauncher'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
