plugins { id 'com.android.application' }

def mapsApiKey = System.getenv('MAPS_API_KEY') ?: (project.findProperty('MAPS_API_KEY') ?: '')
def escapedKey = mapsApiKey.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.mdiaz.trxlauncher'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mdiaz.trxlauncher'
        minSdk 26
        targetSdk 36
        versionCode 121
        versionName '5.2.1'
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        buildConfigField 'String', 'MAPS_API_KEY', "\"${escapedKey}\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
}

dependencies {
    implementation 'com.google.android.libraries.navigation:navigation:7.9.0'
    implementation('com.google.android.libraries.places:places:4.3.1') {
        // Navigation SDK packages the Maps SDK classes itself.
        exclude group: 'com.google.android.gms', module: 'play-services-maps'
    }
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
