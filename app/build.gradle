plugins { id 'com.android.application' }

def mapsApiKey = System.getenv('MAPS_API_KEY') ?: (project.findProperty('MAPS_API_KEY') ?: '')
def escapedMapsApiKey = mapsApiKey.replace('\\', '\\\\').replace('"', '\\"')

android {
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.mdiaz.trxlauncher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mdiaz.trxlauncher'
        minSdk 26
        targetSdk 36
        versionCode 52
        versionName '2.0.2'
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        buildConfigField 'String', 'MAPS_API_KEY', "\"${escapedMapsApiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}


dependencies {
    // 7.9's bundled renderer produces a permanently blank surface on some
    // Android automotive boxes. 6.3.3 is the latest stable 6.x renderer and
    // retains the complete embedded turn-by-turn API used by the launcher.
    api 'com.google.android.libraries.navigation:navigation:6.3.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
