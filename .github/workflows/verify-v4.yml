name: Verify v4 completion
on:
  workflow_dispatch:
  push:
    branches: [finish-v4]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and lint
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
