name: Build TRX Launcher APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore permanent signing key
        env:
          ANDROID_SIGNING_JSON: ${{ secrets.ANDROID_SIGNING_JSON }}
        run: python3 scripts/prepare-signing.py

      - name: Verify Google Navigation key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::Repository secret MAPS_API_KEY is missing. Add the restricted Google Navigation SDK key before building."
            exit 1
          fi

      - name: Build release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease

      - name: Verify APK internal version
        run: |
          AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT_BIN" dump badging app/build/outputs/apk/release/app-release.apk | grep "versionCode='135' versionName='4.3.8'"

      - name: Give APK a friendly name
        run: cp app/build/outputs/apk/release/app-release.apk TRX-Launcher-v4.3.8.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: TRX-Launcher-v4.3.8
          path: TRX-Launcher-v4.3.8.apk
          if-no-files-found: error
          retention-days: 30
