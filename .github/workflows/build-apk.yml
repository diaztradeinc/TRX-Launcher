name: Build Clean TRX Launcher
on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "clean-v5"]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Verify key
        env: { MAPS_API_KEY: "${{ secrets.MAPS_API_KEY }}" }
        run: test -n "$MAPS_API_KEY"
      - name: Build
        env: { MAPS_API_KEY: "${{ secrets.MAPS_API_KEY }}" }
        run: gradle --no-daemon :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk TRX-Launcher-v5.0.0-clean.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TRX-Launcher-v5.0.0-clean
          path: TRX-Launcher-v5.0.0-clean.apk
          retention-days: 30
