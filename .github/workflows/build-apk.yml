name: Build TRX Launcher APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Give APK a friendly name
        run: cp app/build/outputs/apk/release/app-release.apk TRX-Launcher-v0.3.2.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: TRX-Launcher-v0.3.2
          path: TRX-Launcher-v0.3.2.apk
          if-no-files-found: error
          retention-days: 30
